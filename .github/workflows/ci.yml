name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: compile, lint, import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seeone_toobit_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff>=0.15"
      - name: Compile
        run: python -m py_compile live/*.py
      - name: Lint (unused and undefined names)
        run: ruff check live --select F,E9
      - name: Import every module
        run: python -c "import live.bot, live.gate_bot, live.monitor, live.report, live.research, live.localreview, live.rulescore"
